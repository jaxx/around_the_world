[package]
name = "client"
version = "0.1.0"
edition.workspace = true
description = "Browser client for Reis ümber maailma (Leptos, client-side rendered)"

[dependencies]
console_error_panic_hook = "0.1.7"
futures = "0.3.34"
gloo-net = { version = "0.6", default-features = false, features = ["http", "json", "websocket"] }
gloo-timers = { version = "0.4.0", features = ["futures"] }
js-sys = "0.3.106"
leptos = { version = "0.8.22", features = ["csr"] }
protocol = { path = "../protocol" }
rules = { path = "../rules" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
wasm-bindgen = "0.2.129"
wasm-bindgen-futures = "0.4.79"
web-sys = { version = "0.3.106", features = ["Window", "Storage", "Location", "History", "Navigator", "Clipboard", "MediaQueryList"] }
