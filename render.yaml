# Render Blueprint: one free web service built from the Dockerfile.
# Reference: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: reis-ymber-maailma
    runtime: docker
    plan: free
    region: frankfurt
    branch: master
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      # Proxies in front of the server that append to X-Forwarded-For, checked
      # in the "creating a room" debug log on 2026-10-11:
      #   "<client>, <Cloudflare>, <Render balancer>" from peer 127.0.0.1
      # so the client is the third entry from the right. Recheck it with
      # RUST_LOG=info,server=debug if Render changes its proxies
      # (see crates/server/src/client_ip.rs).
      - key: TRUST_PROXY_HOPS
        value: "3"
      - key: RUST_LOG
        value: info
